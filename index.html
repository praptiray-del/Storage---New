<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-upload-alt"></i> File Upload</h1>
            <p>Upload any file to Supabase storage</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-content">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <h3>Drag & Drop files here</h3>
                        <p>or</p>
                        <button class="upload-btn" id="uploadBtn">
                            <i class="fas fa-plus"></i> Choose Files
                        </button>
                        <input type="file" id="fileInput" multiple accept="*/*" style="display: none;">
                    </div>
                </div>

                <div class="file-info" id="fileInfo" style="display: none;">
                    <h3>Selected Files:</h3>
                    <div class="file-list" id="fileList"></div>
                    <button class="submit-btn" id="submitBtn">
                        <i class="fas fa-upload"></i> Upload Files
                    </button>
                </div>

                <div class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">Uploading...</p>
                </div>

                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="success-message" id="successMessage">
                        <i class="fas fa-check-circle"></i>
                        <h3>Upload Successful!</h3>
                        <p>Your files have been uploaded to Supabase storage.</p>
                    </div>
                    <div class="error-message" id="errorMessage" style="display: none;">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Upload Failed</h3>
                        <p id="errorText">An error occurred during upload.</p>
                    </div>
                    <button class="reset-btn" id="resetBtn">
                        <i class="fas fa-refresh"></i> Upload More Files
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 File Upload App. Powered by Supabase.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
